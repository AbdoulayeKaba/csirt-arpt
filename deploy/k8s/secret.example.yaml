# Modèle. Le script bootstrap-vm.sh crée les secrets dans /root/csirt-secrets.
# Ne pas appliquer ce fichier et ne pas y mettre de vrais mots de passe.
apiVersion: v1
kind: Secret
metadata:
  name: csirt-app
type: Opaque
stringData:
  DATABASE_URL: mysql://CHANGE_USER:CHANGE_PASSWORD@mysql:3306/CHANGE_DATABASE
  AUTH_SECRET: CHANGE_ME
  NEXTAUTH_SECRET: CHANGE_ME
  CRON_SECRET: CHANGE_ME
  S3_ACCESS_KEY: CHANGE_ME
  S3_SECRET_KEY: CHANGE_ME
