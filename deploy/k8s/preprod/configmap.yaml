apiVersion: v1
kind: ConfigMap
metadata:
  name: csirt-config
data:
  NODE_ENV: production
  PORT: "3000"
  HOSTNAME: 0.0.0.0
  USE_MOCK_DATA: "false"
  NEXT_PUBLIC_USE_MOCK_DATA: "false"
  NEXTAUTH_URL: http://preprod-csirt.arpt.gov.gn
  EMAIL_PUBLIC_BASE_URL: http://preprod-csirt.arpt.gov.gn
  NEXT_PUBLIC_APP_URL: http://preprod-csirt.arpt.gov.gn
  S3_ENDPOINT: http://minio:9000
  S3_BUCKET: csirt-preprod
  S3_REGION: us-east-1
  S3_FORCE_PATH_STYLE: "true"
