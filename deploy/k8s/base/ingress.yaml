apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: csirt-web
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: csirt.example.invalid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: csirt-web
                port:
                  number: 3000
