apiVersion: batch/v1
kind: CronJob
metadata:
  name: newsletter-campaigns
spec:
  schedule: "15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: csirt-cron
        spec:
          restartPolicy: Never
          containers:
            - name: curl
              image: curlimages/curl:8.11.1
              imagePullPolicy: IfNotPresent
              env:
                - name: CRON_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: csirt-app
                      key: CRON_SECRET
              command:
                - /bin/sh
                - -c
                - |
                  curl -fsS -X POST \
                    -H "Authorization: Bearer ${CRON_SECRET}" \
                    "http://csirt-web:3000/api/cron/newsletter-campaigns"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
