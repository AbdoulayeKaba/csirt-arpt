apiVersion: batch/v1
kind: CronJob
metadata:
  name: newsletter-campaigns
  labels:
    {{- include "csirt.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.cron.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: csirt-cron
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
          containers:
            - name: curl
              image: {{ .Values.cron.image }}
              imagePullPolicy: IfNotPresent
              env:
                - name: CRON_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.appSecret }}
                      key: CRON_SECRET
              command:
                - /bin/sh
                - -c
                - |
                  curl -fsS -X POST \
                    -H "Authorization: Bearer ${CRON_SECRET}" \
                    "http://csirt-web:3000/api/cron/newsletter-campaigns"
